; 用途：只覆盖已由本机原版反汇编与运行只读采样交叉验证的对象数组布局。
; 仅覆盖 build26367565 / platform/steam/PBZ.exe SHA256 4415933c...69e423。
; FUObjectArray.ObjObjects 仍为 +0x10，条目大小 0x18、Object +0x8 与通用 UE5.7 相同。
; 本配置其余反射布局尚未验证，不能据此声称 Boss Mod 已可用。
[TUObjectArray]
MaxChunks = 0x0
NumChunks = 0x4
Objects = 0x8
NumElements = 0x10
MaxElements = 0x14
PreAllocatedObjects = 0x18
UEP_TotalSize = 0x20

; 用途：原版添加监听器函数 RVA 0x164CB00 明确操作 +0xA8/+0xB0/+0xB4。
; 通用偏移 +0x80 实际是创建监听器临界区，误当 TArray 会在初始化时崩溃。
; 这里只覆盖已确认的删除监听器数组，不猜 FUObjectArray 总尺寸。
[FUObjectArray]
UObjectDeleteListeners = 0xA8

; 用途：原版 Actor/Pawn/Character/名称转换函数的链式只读探针确认 Next 与 Owner 交换。
[FField]
Next = 0x10
Owner = 0x18

; 用途：从实际属性类型元对象解析名称，确认 FName 与 ConstructFn 交换。
[FFieldClass]
FName = 0x30
ConstructFn = 0x0
; 用途：Struct/Bool/Name/Str 四种类型的继承位集合位于 +0x10，单一类型 Id 在 +0x18。
; 不修正时 Lua 能找到 Actor，却会把其所有属性过滤掉，导致空属性链。
CastFlags = 0x10
Id = 0x18

; 用途：UStruct 保留 Super/Children/ChildProperties，随后新增区段导致其余成员后移 0x50。
; PropertiesSize 已用三个类与一个函数交叉核对；链接指针和其余尾部映射仍需初始化/反射实测。
[UStruct]
PropertiesSize = 0xA8
MinAlignment = 0xAC
StructStateFlags = 0xAE
Script = 0xB0
PropertyLink = 0xC0
RefLink = 0xC8
DestructorLink = 0xD0
PostConstructLink = 0xD8
ScriptAndPropertyObjectReferences = 0xE0
UnresolvedScriptProperties = 0xF0
UEP_TotalSize = 0x100

; 用途：已命名类的 CDO、ClassWithin、标志和静态构造指令确认 UClass 派生区段后移。
[UClass]
ClassConstructor = 0x100
ClassVTableHelperCtorCaller = 0x108
ClassUnique = 0x118
FirstOwnedClassRep = 0x11C
bCooked = 0x120
bLayoutChanging = 0x121
ClassFlags = 0x124
ClassCastFlags = 0x128
ClassWithin = 0x130
ClassConfigName = 0x138
NetFields = 0x150
ClassDefaultObject = 0x160
SparseClassData = 0x168
SparseClassDataStruct = 0x170
bNeedsDynamicSubobjectInstancing = 0x178
FuncMap = 0x180
FuncMapLock = 0x1D0
AllFunctionsCache = 0x1D8
AllFunctionsCacheLock = 0x228
Interfaces = 0x230
ReferenceSchema = 0x240
NativeFunctionLookupTable = 0x248
UEP_TotalSize = 0x258

; 用途：Conv_NameToString 两个参数、24字节参数区、返回偏移8与 Func 指针共同验证。
[UFunction]
FunctionFlags = 0x100
NumParms = 0x104
ParmsSize = 0x106
ReturnValueOffset = 0x108
RPCId = 0x10A
RPCResponseId = 0x10C
FirstPropertyToInit = 0x110
EventGraphFunction = 0x118
EventGraphCallOffset = 0x120
Func = 0x128
UEP_TotalSize = 0x130
